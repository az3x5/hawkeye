# NVIDIA GPU overlay. Apply this last so its CUDA image and device requests
# override the CPU-safe defaults and the published-image deployment overlay.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-hawkeye-api:dev}
    image: hawkeye-api:gpu
    environment:
      FACEID_SCRFD_PROVIDERS: '["CUDAExecutionProvider","CPUExecutionProvider"]'
      FACEID_ADAFACE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    image: hawkeye-api:gpu
    environment:
      FACEID_SCRFD_PROVIDERS: '["CUDAExecutionProvider","CPUExecutionProvider"]'
      FACEID_ADAFACE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
