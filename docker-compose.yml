# Local development topology.
#
# Only the API publishes a host port. Postgres, Redis and Qdrant are reachable
# on the internal `faceid` network only — Qdrant in particular must never be
# exposed publicly, since it holds biometric embeddings.
services:
  api:
    build: ./backend
    image: faceid-api:dev
    env_file: [.env]
    environment:
      FACEID_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FACEID_REDIS_DSN: redis://redis:6379/0
      FACEID_QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    networks: [faceid]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [faceid]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis-data:/data]
    networks: [faceid]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    # No `ports:` mapping on purpose — internal network access only.
    volumes: [qdrant-data:/qdrant/storage]
    networks: [faceid]

networks:
  faceid:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
