# Local development topology.
#
# Only the API publishes a host port. Postgres, Redis and Qdrant are reachable
# on the internal `faceid` network only — Qdrant in particular must never be
# exposed publicly, since it holds biometric embeddings.
services:
  api:
    build: ./backend
    image: hawkeye-api:dev
    env_file: [.env]
    environment:
      FACEID_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FACEID_REDIS_DSN: redis://redis:6379/0
      FACEID_QDRANT_URL: http://qdrant:6333
      FACEID_OBJECT_STORE_ROOT: /srv/objects
      # Current deployment keeps originals on Cyber-AI's persistent object-data
      # volume. Set OBJECT_STORE_BACKEND=s3 only for a deliberate later migration.
      FACEID_OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-filesystem}
      FACEID_S3_ENDPOINT_URL: http://minio:9000
      FACEID_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      FACEID_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FACEID_S3_USE_PATH_STYLE: "true"
      FACEID_MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-268435456}
      FACEID_DECISION_ACCEPT_THRESHOLD: ${FACEID_DECISION_ACCEPT_THRESHOLD}
      FACEID_DECISION_REVIEW_THRESHOLD: ${FACEID_DECISION_REVIEW_THRESHOLD}
      FACEID_DECISION_POLICY_VERSION: ${FACEID_DECISION_POLICY_VERSION}
      FACEID_QUERY_IMAGE_RETENTION_DAYS: ${FACEID_QUERY_IMAGE_RETENTION_DAYS:-30}
      FACEID_RATE_LIMIT_IDENTIFY: ${FACEID_RATE_LIMIT_IDENTIFY:-30}
      FACEID_RATE_LIMIT_ENROL: ${FACEID_RATE_LIMIT_ENROL:-120}
      FACEID_SCRFD_MODEL_PATH: /srv/models/scrfd_10g_bnkps.onnx
      FACEID_SCRFD_MODEL_SHA256: ${FACEID_SCRFD_MODEL_SHA256:-}
      FACEID_ADAFACE_MODEL_PATH: /srv/models/adaface_ir101_webface12m.safetensors
      FACEID_ADAFACE_MODEL_SHA256: ${FACEID_ADAFACE_MODEL_SHA256:-}
      # Bounded so the API and the worker do not each try to own every core.
      # The API only runs a model per identify request; the worker runs them
      # continuously, so the larger share goes there.
      FACEID_SCRFD_INTRA_OP_THREADS: ${API_MODEL_THREADS:-2}
      FACEID_ADAFACE_TORCH_THREADS: ${API_MODEL_THREADS:-2}
      FACEID_SCRFD_PROVIDERS: ${SCRFD_PROVIDERS:-["CPUExecutionProvider"]}
      FACEID_ADAFACE_DEVICE: ${ADAFACE_DEVICE:-cpu}
      FACEID_LANGUAGE_EMBEDDING_MODEL: ${LANGUAGE_EMBEDDING_MODEL:-alakxender/e5-dhivehi-combined-mnr}
      FACEID_LANGUAGE_EMBEDDING_VERSION: ${LANGUAGE_EMBEDDING_VERSION:-65ead4fb4e6c5f72ef08eeed13eb2006bfa5f7ad}
      FACEID_LANGUAGE_EMBEDDING_DEVICE: ${LANGUAGE_EMBEDDING_DEVICE:-cpu}
      FACEID_LANGUAGE_EMBEDDING_BATCH_SIZE: ${LANGUAGE_EMBEDDING_BATCH_SIZE:-16}
      FACEID_DHIVEHI_AI_URL: http://dhivehi-ai:8010
      HF_HOME: /srv/model-cache
    ports: ["127.0.0.1:8000:8000"]
    # Weights are mounted read-only, never baked into the image or committed.
    # Source images are shared with the worker, which reads what the API wrote.
    volumes:
      - "./models:/srv/models:ro"
      - "object-data:/srv/objects"
      - "language-model-cache-v2:/srv/model-cache"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_healthy}
      dhivehi-ai: {condition: service_healthy}
    networks: [faceid]

  frontend:
    build: ./frontend
    image: hawkeye-review:dev
    environment:
      # Server-side only: the browser never reaches the API directly, so the
      # API needs no public exposure and no CORS.
      FACEID_API_URL: http://api:8000
      # Whether the session cookie is marked Secure. Defaults to true; a
      # browser discards a Secure cookie over plain HTTP on any origin but
      # localhost, so a deployment served without TLS must say so explicitly.
      HAWKEYE_COOKIE_SECURE: ${HAWKEYE_COOKIE_SECURE:-true}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    networks: [faceid]

  worker:
    # No build of its own: this is the api image with a different command, and
    # a second build targeting the same tag makes `compose build` fail.
    image: hawkeye-api:dev
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      FACEID_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FACEID_REDIS_DSN: redis://redis:6379/0
      FACEID_QDRANT_URL: http://qdrant:6333
      FACEID_OBJECT_STORE_ROOT: /srv/objects
      FACEID_OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-filesystem}
      FACEID_S3_ENDPOINT_URL: http://minio:9000
      FACEID_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      FACEID_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FACEID_S3_USE_PATH_STYLE: "true"
      FACEID_MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-268435456}
      FACEID_DECISION_ACCEPT_THRESHOLD: ${FACEID_DECISION_ACCEPT_THRESHOLD}
      FACEID_DECISION_REVIEW_THRESHOLD: ${FACEID_DECISION_REVIEW_THRESHOLD}
      FACEID_DECISION_POLICY_VERSION: ${FACEID_DECISION_POLICY_VERSION}
      FACEID_QUERY_IMAGE_RETENTION_DAYS: ${FACEID_QUERY_IMAGE_RETENTION_DAYS:-30}
      FACEID_RATE_LIMIT_IDENTIFY: ${FACEID_RATE_LIMIT_IDENTIFY:-30}
      FACEID_RATE_LIMIT_ENROL: ${FACEID_RATE_LIMIT_ENROL:-120}
      FACEID_SCRFD_MODEL_PATH: /srv/models/scrfd_10g_bnkps.onnx
      FACEID_SCRFD_MODEL_SHA256: ${FACEID_SCRFD_MODEL_SHA256:-}
      FACEID_ADAFACE_MODEL_PATH: /srv/models/adaface_ir101_webface12m.safetensors
      FACEID_ADAFACE_MODEL_SHA256: ${FACEID_ADAFACE_MODEL_SHA256:-}
      FACEID_SCRFD_INTRA_OP_THREADS: ${WORKER_MODEL_THREADS:-6}
      FACEID_ADAFACE_TORCH_THREADS: ${WORKER_MODEL_THREADS:-6}
      FACEID_SCRFD_PROVIDERS: ${SCRFD_PROVIDERS:-["CPUExecutionProvider"]}
      FACEID_ADAFACE_DEVICE: ${ADAFACE_DEVICE:-cpu}
    # No published port: the worker claims durable PostgreSQL jobs, not callers.
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_healthy}
    volumes:
      - "./models:/srv/models:ro"
      - "object-data:/srv/objects"
    networks: [faceid]

  language-worker:
    image: hawkeye-api:dev
    command: ["python", "-m", "app.language_worker"]
    env_file: [.env]
    environment:
      FACEID_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FACEID_REDIS_DSN: redis://redis:6379/0
      FACEID_QDRANT_URL: http://qdrant:6333
      FACEID_LANGUAGE_EMBEDDING_MODEL: ${LANGUAGE_EMBEDDING_MODEL:-alakxender/e5-dhivehi-combined-mnr}
      FACEID_LANGUAGE_EMBEDDING_VERSION: ${LANGUAGE_EMBEDDING_VERSION:-65ead4fb4e6c5f72ef08eeed13eb2006bfa5f7ad}
      FACEID_LANGUAGE_EMBEDDING_DEVICE: ${LANGUAGE_EMBEDDING_DEVICE:-cpu}
      FACEID_LANGUAGE_EMBEDDING_BATCH_SIZE: ${LANGUAGE_EMBEDDING_BATCH_SIZE:-16}
      HF_HOME: /srv/model-cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes:
      - "language-model-cache-v2:/srv/model-cache"
    networks: [faceid]

  dhivehi-ai:
    image: hawkeye-api:dev
    command:
      [
        "uvicorn",
        "app.dhivehi_ai:get_asgi_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
        "--workers",
        "1",
      ]
    environment:
      DHIVEHI_AI_CACHE_DIR: /srv/dhivehi-model-cache
      DHIVEHI_AI_EMBEDDING_CACHE_DIR: /srv/language-model-cache/hub
      DHIVEHI_AI_DEVICE: ${DHIVEHI_AI_DEVICE:-cpu}
      DHIVEHI_AI_TORCH_THREADS: ${DHIVEHI_AI_TORCH_THREADS:-8}
      DHIVEHI_AI_BOT_URL: http://ollama:11434
      DHIVEHI_AI_BOT_MODEL: ${DHIVEHI_AI_BOT_MODEL:-qwen3:4b-instruct}
      DHIVEHI_AI_BOT_TIMEOUT_SECONDS: ${DHIVEHI_AI_BOT_TIMEOUT_SECONDS:-300}
      HF_HOME: /srv/dhivehi-model-cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - "dhivehi-model-cache:/srv/dhivehi-model-cache"
      - "language-model-cache-v2:/srv/language-model-cache:ro"
    depends_on:
      ollama: {condition: service_healthy}
    networks: [faceid]

  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - "ollama-models:/root/.ollama"
    networks: [faceid]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Buckets hold media and biometric crops. Nothing here is public, and
      # anonymous access is refused rather than left to bucket policy alone.
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    # Loopback only, for local integration tests and operator inspection.
    # The API reaches MinIO over the internal network, not through this.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [minio-data:/data]
    networks: [faceid]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only, for local migrations and integration tests. Remove this
    # mapping in any shared or deployed environment.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [faceid]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis-data:/data]
    networks: [faceid]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    # No `ports:` mapping on purpose — internal network access only.
    volumes: [qdrant-data:/qdrant/storage]
    networks: [faceid]

networks:
  faceid:
    driver: bridge

volumes:
  object-data:
  minio-data:
  postgres-data:
  redis-data:
  qdrant-data:
  language-model-cache-v2:
  dhivehi-model-cache:
  ollama-models:
