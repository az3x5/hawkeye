# Deployment overlay.
#
# The base topology binds everything to loopback, which is right for a laptop
# and unreachable on a server. This publishes only the two services a person
# uses — the API and the review app — on an address the deployment chooses.
#
# BIND_ADDR should be a specific interface, not 0.0.0.0. On this deployment it
# is the host's Tailscale address, so traffic to it is carried inside
# WireGuard: the application still speaks plain HTTP, and that encryption is
# what stands between a session token and the network.
#
# Postgres, Redis, Qdrant and MinIO stay unpublished. Qdrant holds biometric
# embeddings and MinIO holds the media bytes themselves; the base topology
# publishes MinIO on loopback for local tests, which a deployment does not
# want and does not need, because the API reaches it over the internal network.
#
# Every service also gets a CPU and memory ceiling. The host has 16 cores and
# 30 GB; without limits one runaway inference job or one Postgres query can
# take all of it and stall everything else, including the health checks that
# would tell you it happened. The ceilings deliberately overlap — they cap a
# single service, they are not a partition of the machine — but the memory
# ceilings sum to roughly 23 GB, leaving the host its own headroom.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
services:
  api:
    deploy:
      resources:
        limits: {cpus: "3.0", memory: 3500m}
    ports: !override ["${BIND_ADDR:?set BIND_ADDR to the interface to publish on}:8000:8000"]
    restart: unless-stopped

  frontend:
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 750m}
    ports: !override ["${BIND_ADDR}:3000:3000"]
    environment:
      FACEID_API_URL: http://api:8000
      HAWKEYE_COOKIE_SECURE: ${HAWKEYE_COOKIE_SECURE:-true}
    restart: unless-stopped

  worker:
    deploy:
      resources:
        limits: {cpus: "6.0", memory: 4g}
    restart: unless-stopped

  language-worker:
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2500m}
    restart: unless-stopped

  dhivehi-ai:
    deploy:
      resources:
        limits: {cpus: "8.0", memory: 7g}
    restart: unless-stopped

  ollama:
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 6g}
    restart: unless-stopped

  postgres:
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2500m}
    ports: !override []
    restart: unless-stopped

  redis:
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}
    restart: unless-stopped

  qdrant:
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2g}
    restart: unless-stopped

  minio:
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}
    ports: !override []
    restart: unless-stopped
