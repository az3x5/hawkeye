[project]
name = "faceid-backend"
version = "0.1.0"
description = "Face ID module of the Person Intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "numpy>=2.0",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
    # Recognition backbone. CPU wheels: install with
    #   --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.4",
    "sentence-transformers>=3.1,<6",
    "transformers>=4.52,<5",
    "accelerate>=1.2,<2",
    "pillow>=11,<13",
    "soundfile>=0.13,<1",
    "librosa>=0.11,<1",
    "safetensors>=0.4",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
    # S3-compatible object storage: MinIO locally, S3 in AWS.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2>=0.28",
    "ruff>=0.6",
    "mypy>=1.11",
    # Supplies a real photograph of a face for detection tests, offline.
    "scikit-image>=0.24",
]

# Without this, setuptools sees `app` and `migrations` side by side and
# refuses to guess which is the package. It never surfaced in the image build,
# where only pyproject.toml exists when dependencies are installed.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; classes only group them.
# S105/S106: test fixtures need literal passwords; the rule still guards app/.
"tests/*" = ["S101", "S105", "S106", "D101", "D102", "D103", "D107", "ANN001", "SLF001"]
# Alembic owns the shape of generated revisions: its template's imports,
# typing style and long generated literals are not ours to restyle.
"migrations/versions/*" = ["D", "ANN", "UP", "I", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
files = ["app", "tests"]

# onnxruntime ships no type information.
[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers.*", "librosa.*", "soundfile.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

# boto3/botocore ship no type information.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
