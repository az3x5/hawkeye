name: Publish images

# Images are published only from main, and only after CI has passed on the
# same commit: an image that nobody checked is worse than no image, because it
# looks deployable.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    # workflow_run fires whatever the outcome; only a success may publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: hawkeye-api
            context: ./backend
          - image: hawkeye-review
            context: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit CI actually tested, not whatever main has drifted
          # to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` for convenience, the commit sha so a deployment can name
          # exactly what it is running.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: torch alone is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
